<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Among Creators Pack</title>
    <meta name="description" content="Página no encontrada en Among Creators Pack.">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            padding: 1.5rem;
            color: #e0ecff;
            text-align: center;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(2px 2px at 85% 45%, #fff, transparent),
                radial-gradient(3px 3px at 30% 70%, #fff8, transparent),
                radial-gradient(2px 2px at 70% 15%, #fff, transparent),
                radial-gradient(3px 3px at 95% 80%, #fff6, transparent),
                radial-gradient(2px 2px at 45% 55%, #fff, transparent);
            background-repeat: no-repeat;
            pointer-events: none;
            opacity: 0.5;
            z-index: 0;
        }

        .box {
            position: relative;
            z-index: 10;
            max-width: 520px;
            background: rgba(8, 14, 28, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(90, 150, 255, 0.25);
            border-radius: 3rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(60, 130, 255, 0.1) inset;
        }

        /* Crewmates decorativos */
        .crew-icon {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .crew-icon span {
            width: 42px;
            height: 42px;
            background: #5a9eff;
            border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 0 12px #3e7eff;
        }

        .crew-icon span::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 13px;
            background: #0b0f1c;
            border-radius: 50%;
            top: 10px;
            left: 11px;
            box-shadow: 0 0 0 3px #c0d8ff;
        }

        .crew-icon span::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            background: #0b0f1c;
            border-radius: 50%;
            top: 8px;
            left: 19px;
            box-shadow: -11px 0 0 #0b0f1c;
        }

        .emoji {
            font-size: 4.5rem;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 20px #ffc857);
            animation: flotar 3s infinite alternate ease-in-out;
        }

        @keyframes flotar {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 4.5rem;
            font-weight: 700;
            color: #eef5ff;
            text-shadow: 0 0 20px #3e7eff, 0 0 5px #9ac0ff;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #ffc857;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 0 12px rgba(255, 200, 87, 0.5);
        }

        p {
            color: #a0b8dd;
            line-height: 1.7;
            margin-bottom: 2rem;
            font-size: 1.05rem;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            max-width: 280px;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn-primary {
            background: #3266c0;
            color: white;
            border: 1px solid #7aa9ff;
            box-shadow: 0 6px 0 #0b1a2e, 0 8px 20px black;
        }

        .btn-primary:hover {
            background: #4177d4;
            transform: scale(1.02);
            box-shadow: 0 6px 0 #0b1a2e, 0 12px 25px black;
        }

        .btn-primary:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0b1a2e, 0 8px 20px black;
        }

        .btn-secondary {
            background: transparent;
            color: #8bb2ff;
            border: 1px dashed #3e7eff;
        }

        .btn-secondary:hover {
            background: rgba(62, 126, 255, 0.1);
            color: #c0d8ff;
        }

        .footer-note {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1f3350;
            color: #6b85aa;
            font-size: 0.85rem;
        }

        .footer-note a {
            color: #8bb2ff;
            text-decoration: none;
            width: auto;
            padding: 0;
            box-shadow: none;
            border: none;
            display: inline;
        }

        .footer-note a:hover {
            color: #ffd966;
            transform: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="crew-icon" aria-hidden="true">
            <span></span>
            <span style="background: #ff6b6b; box-shadow: 0 0 12px #ff4d4d;"></span>
            <span style="background: #8effa0; box-shadow: 0 0 12px #5eff7a;"></span>
        </div>

        <div class="emoji">👾</div>
        <h1>404</h1>
        <div class="subtitle">Página no encontrada</div>

        <p>
            Parece que un <strong style="color: #ff6b6b;">impostor</strong> se llevó esta página.
            Vuelve al inicio para encontrar lo que buscabas.
        </p>

        <div class="buttons">
            <a href="/among-creators-pack/" class="btn-primary">
                ← Volver al inicio
            </a>
            <a href="https://discord.gg/s24PZyMBmA" target="_blank" rel="noopener noreferrer" class="btn-secondary">
                💬 Pedir ayuda en Discord
            </a>
        </div>

        <div class="footer-note">
            Among Creators Pack · <a href="/among-creators-pack/">Ir al inicio</a>
        </div>
    </div>
</body>
</html>
