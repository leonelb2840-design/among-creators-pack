name: 💡 Sugerir una mejora
description: Ideas para mejorar la web, el pack o el proyecto en general
title: "[Sugerencia] "
labels: ["sugerencia", "enhancement"]
assignees:
  - leonelb2840-design
body:
  - type: markdown
    attributes:
      value: |
        ¡Gracias por tu sugerencia! 💡
        Cuéntanos tu idea con el máximo detalle para que podamos valorarla bien.

  - type: dropdown
    id: area
    attributes:
      label: ¿A qué área se refiere tu sugerencia?
      options:
        - 🌐 Página web (diseño, secciones, funcionalidad)
        - 📦 Recursos del pack (nuevos tipos de contenido)
        - 💬 Sistema de feedback
        - 📱 PWA / experiencia móvil
        - ⚡ Rendimiento / velocidad
        - 📜 Documentación (README, CHANGELOG)
        - 🎨 Estilo visual / colores / tipografía
        - ❓ Otra
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Tu idea
      description: ¿Qué se te ha ocurrido? Descríbelo con detalle.
      placeholder: "Se me ocurre añadir un modo claro/oscuro en la web que se guarde en localStorage..."
    validations:
      required: true

  - type: textarea
    id: porque
    attributes:
      label: ¿Por qué crees que sería útil?
      description: ¿Qué problema resuelve o qué mejora aporta?
      placeholder: "Ayudaría a las personas que usan la web de noche, sería más cómodo leer..."
    validations:
      required: true

  - type: textarea
    id: ejemplos
    attributes:
      label: Ejemplos, mockups o referencias
      description: Si tienes capturas, dibujos o enlaces a algo similar, añádelos aquí
      placeholder: "Arrastra imágenes aquí, o pega enlaces..."
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: ¿Qué prioridad le darías?
      options:
        - 🔥 Alta (mejora significativa)
        - ⚡ Media (útil pero no urgente)
        - 🌙 Baja (detalle menor)
    validations:
      required: true

  - type: checkboxes
    id: confirmaciones
    attributes:
      label: Confirmaciones
      options:
        - label: He buscado sugerencias similares y no encontré duplicados
          required: true
        - label: Mi sugerencia respeta la [política de fans de Innersloth](https://www.innersloth.com/fan-creation-policy/)
          required: true
