<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión · Among Creators Pack</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #0b0f1c, #03050a);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', system-ui, sans-serif;
            padding: 1.5rem;
            color: #e0ecff;
            text-align: center;
        }
        .box {
            max-width: 500px;
            background: rgba(8, 14, 28, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(90, 150, 255, 0.3);
            border-radius: 2.5rem;
            padding: 3rem 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7);
        }
        .emoji { font-size: 4rem; margin-bottom: 1rem; }
        h1 {
            font-size: 2rem;
            color: #eef5ff;
            text-shadow: 0 0 20px #3e7eff;
            margin-bottom: 0.8rem;
        }
        p { color: #a0b8dd; line-height: 1.6; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #3266c0;
            color: white;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            border: 1px solid #7aa9ff;
            box-shadow: 0 6px 0 #0b1a2e, 0 8px 20px black;
            transition: 0.2s;
        }
        a:hover { background: #4177d4; transform: scale(1.02); }
        a:active { transform: translateY(4px); box-shadow: 0 2px 0 #0b1a2e; }
    </style>
</head>
<body>
    <div class="box">
        <div class="emoji">📡</div>
        <h1>Sin conexión</h1>
        <p>No pudimos cargar esta página porque no tienes internet y aún no estaba en caché. Vuelve a intentarlo cuando recuperes la conexión.</p>
        <a href="./index.html">Reintentar</a>
    </div>
</body>
</html>
